server:
  port: ${PILIPALA_API_PORT:8080}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      table-underline: true

spring:
  application:
    name: pilipala-api
  # 全部字段 snake_case，与 api/gateway-contract.md 的内部合同一致。
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/pilipala}
    username: ${SPRING_DATASOURCE_USERNAME:pilipala}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${PILIPALA_DB_POOL_SIZE:10}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  # WP4：outbox dispatcher 投递到 RabbitMQ。默认凭据是官方本地 guest，仅本机开发用；
  # 其它环境必须用环境变量注入。broker 没起时 actuator 的 rabbit 探针会报 DOWN。
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# WP3 起提供注册/登录/登出与会话；会话存 Redis，token 走请求头，不走 cookie。
sa-token:
  token-name: ${PILIPALA_TOKEN_NAME:pilipala-token}
  timeout: ${PILIPALA_TOKEN_TIMEOUT:2592000}
  is-log: false
  is-read-header: true
  is-read-cookie: false
  is-read-body: false

# WP5+ 的 Anytoken hop 才消费这两个值。本阶段的作用是把密钥注入路径
# 固定成环境变量，仓库里不出现真实 Key。
pilipala:
  # 对外 URL 根（无尾 /）。生产经 env 设为 https://pilipala.art；本地联调用 http://127.0.0.1:5173 等，勿写死在代码里。
  public-base-url: ${PILIPALA_PUBLIC_BASE_URL:}
  # WP11：Admin 运维与配置后台。
  admin:
    # 逗号分隔的初始管理员用户名列表（过渡期双读，后续可删）
    bootstrap-usernames: ${PILIPALA_ADMIN_BOOTSTRAP_USERNAMES:admin,pilipala_admin}
    # WP17：手机号 / 邮箱引导 admin（E.164 或邮箱小写，逗号分隔）
    bootstrap-phones: ${PILIPALA_ADMIN_BOOTSTRAP_PHONES:}
    bootstrap-emails: ${PILIPALA_ADMIN_BOOTSTRAP_EMAILS:}
  # WP17：OTP 短信（阿里云）与邮件（自建 SMTP）；密钥只走环境变量
  auth:
    sms:
      provider: ${PILIPALA_SMS_PROVIDER:smsbao}
      smsbao:
        username: ${PILIPALA_SMS_SMSBAO_USERNAME:}
        api-key: ${PILIPALA_SMS_SMSBAO_API_KEY:}
        goods-id: ${PILIPALA_SMS_SMSBAO_GOODS_ID:}
        content-template: ${PILIPALA_SMS_SMSBAO_CONTENT_TEMPLATE:【pilipala】您的验证码是{code}，5分钟内有效。若非本人操作请忽略。}
        base-url: ${PILIPALA_SMS_SMSBAO_BASE_URL:https://api.smsbao.com/sms}
      aliyun:
        access-key-id: ${PILIPALA_SMS_ALIYUN_ACCESS_KEY_ID:}
        access-key-secret: ${PILIPALA_SMS_ALIYUN_ACCESS_KEY_SECRET:}
        sign-name: ${PILIPALA_SMS_ALIYUN_SIGN_NAME:}
        template-register: ${PILIPALA_SMS_ALIYUN_TEMPLATE_REGISTER:}
        template-login: ${PILIPALA_SMS_ALIYUN_TEMPLATE_LOGIN:}
        template-rebind: ${PILIPALA_SMS_ALIYUN_TEMPLATE_REBIND:}
        template-reset: ${PILIPALA_SMS_ALIYUN_TEMPLATE_RESET:}
        endpoint: ${PILIPALA_SMS_ALIYUN_ENDPOINT:dysmsapi.aliyuncs.com}
    mail:
      host: ${PILIPALA_MAIL_HOST:}
      port: ${PILIPALA_MAIL_PORT:587}
      username: ${PILIPALA_MAIL_USERNAME:}
      password: ${PILIPALA_MAIL_PASSWORD:}
      from: ${PILIPALA_MAIL_FROM:}
      starttls: ${PILIPALA_MAIL_STARTTLS:true}
  gateway:
    base-url: ${PILIPALA_GATEWAY_BASE_URL:}
    api-key: ${PILIPALA_GATEWAY_API_KEY:}
  # WP4 的 Job 域配置。队列名只存在这里与 Rabbit 声明里，禁止写进 job 行（ADR 0003）。
  job:
    # rabbit = 真 broker；fake = 本地内存假 transport（测试与无 broker 演练用）。
    transport: ${PILIPALA_JOB_TRANSPORT:rabbit}
    exchange: ${PILIPALA_JOB_EXCHANGE:pilipala.jobs}
    routing-key: ${PILIPALA_JOB_ROUTING_KEY:job.execute}
    queue: ${PILIPALA_JOB_QUEUE:pilipala.jobs.execute}
    dead-letter-queue: ${PILIPALA_JOB_DEAD_LETTER_QUEUE:pilipala.jobs.execute.dlq}
    # worker 领取 job 的 Redis 短锁 TTL（秒）。权威状态在 Postgres，这里只是短锁。
    lease-ttl-seconds: ${PILIPALA_JOB_LEASE_TTL_SECONDS:60}
    outbox:
      # dispatcher 的轮询间隔（毫秒）与单轮最多投递多少条。
      poll-ms: ${PILIPALA_OUTBOX_POLL_MS:500}
      batch-size: ${PILIPALA_OUTBOX_BATCH_SIZE:50}
      # 同一条 outbox 连续投递失败多少次后停在 failed（不再自动重试）。
      max-attempts: ${PILIPALA_OUTBOX_MAX_ATTEMPTS:10}
  # WP6 的预付费钱包。金额一律整数 credit（BIGINT）。
  billing:
    # 单次任务默认冻结 credit 数（正整数）。
    default-job-cost: ${PILIPALA_BILLING_DEFAULT_JOB_COST:10}
    # 新注册用户初始赠送 credit 数（默认 0；若 > 0 则注册时自动记一笔 topup 流水）。
    initial-credits: ${PILIPALA_BILLING_INITIAL_CREDITS:0}
    # 后台扫描 worker 已完成任务并自动 confirm/release 冻结单的间隔（毫秒）与批大小。
    settle-poll-ms: ${PILIPALA_BILLING_SETTLE_POLL_MS:200}
    settle-batch-size: ${PILIPALA_BILLING_SETTLE_BATCH_SIZE:50}
    zpay:
      api-base: ${PILIPALA_ZPAY_API_BASE:https://api.z-pay.cn}
      pid: ${PILIPALA_ZPAY_PID:}
      pkey: ${PILIPALA_ZPAY_PKEY:}
      cid: ${PILIPALA_ZPAY_CID:12540}
    recharge:
      order-ttl-minutes: ${PILIPALA_RECHARGE_ORDER_TTL_MINUTES:30}
      reconcile-poll-ms: ${PILIPALA_RECHARGE_RECONCILE_POLL_MS:5000}
      reconcile-batch-size: ${PILIPALA_RECHARGE_RECONCILE_BATCH_SIZE:50}
      packages:
        - id: p10
          money-fen: 1000
          credits: 100
          name: pilipala credits 100
        - id: p50
          money-fen: 5000
          credits: 550
          name: pilipala credits 550
        - id: p100
          money-fen: 10000
          credits: 1200
          name: pilipala credits 1200
  # WP8 的火山引擎 TOS。api 只签发短期预签名读地址，字节由 worker 写入。
  storage:
    tos:
      # stub = 本地零密钥模式（worker 写 local-dir，api 同样按 V4 规则签出短期 URL）；http = 调真实火山 TOS HTTP 接口
      mode: ${PILIPALA_TOS_MODE:stub}
      endpoint: ${PILIPALA_TOS_ENDPOINT:https://tos-cn-beijing.volces.com}
      region: ${PILIPALA_TOS_REGION:cn-beijing}
      bucket: ${PILIPALA_TOS_BUCKET:pilipala-dev}
      access-key: ${PILIPALA_TOS_ACCESS_KEY:pilipala-local-ak}
      secret-key: ${PILIPALA_TOS_SECRET_KEY:pilipala-local-sk}
      presign-ttl-seconds: ${PILIPALA_TOS_PRESIGN_TTL_SECONDS:900}
      timeout-ms: ${PILIPALA_TOS_TIMEOUT_MS:15000}
      local-dir: ${PILIPALA_TOS_LOCAL_DIR:/tmp/pilipala-tos}
