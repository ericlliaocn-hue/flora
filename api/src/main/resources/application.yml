server:
  port: ${FLORA_API_PORT:8080}

spring:
  application:
    name: flora-api
  # 全部字段 snake_case，与 api/gateway-contract.md 的内部合同一致。
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/flora}
    username: ${SPRING_DATASOURCE_USERNAME:flora}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      maximum-pool-size: ${FLORA_DB_POOL_SIZE:10}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  # WP4：outbox dispatcher 投递到 RabbitMQ。默认凭据是官方本地 guest，仅本机开发用；
  # 其它环境必须用环境变量注入。broker 没起时 actuator 的 rabbit 探针会报 DOWN。
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:127.0.0.1}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:/}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# WP3 起提供注册/登录/登出与会话；会话存 Redis，token 走请求头，不走 cookie。
sa-token:
  token-name: ${FLORA_TOKEN_NAME:flora-token}
  timeout: ${FLORA_TOKEN_TIMEOUT:2592000}
  is-log: false
  is-read-header: true
  is-read-cookie: false
  is-read-body: false

# WP5+ 的 Anytoken hop 才消费这两个值。本阶段的作用是把密钥注入路径
# 固定成环境变量，仓库里不出现真实 Key。
flora:
  # WP11：Admin 运维与配置后台。
  admin:
    # 逗号分隔的初始管理员用户名列表：命中者在注册或登录时自动升为 admin 角色
    bootstrap-usernames: ${FLORA_ADMIN_BOOTSTRAP_USERNAMES:admin,flora_admin}
  gateway:
    base-url: ${FLORA_GATEWAY_BASE_URL:}
    api-key: ${FLORA_GATEWAY_API_KEY:}
  # WP4 的 Job 域配置。队列名只存在这里与 Rabbit 声明里，禁止写进 job 行（ADR 0003）。
  job:
    # rabbit = 真 broker；fake = 本地内存假 transport（测试与无 broker 演练用）。
    transport: ${FLORA_JOB_TRANSPORT:rabbit}
    exchange: ${FLORA_JOB_EXCHANGE:flora.jobs}
    routing-key: ${FLORA_JOB_ROUTING_KEY:job.execute}
    queue: ${FLORA_JOB_QUEUE:flora.jobs.execute}
    dead-letter-queue: ${FLORA_JOB_DEAD_LETTER_QUEUE:flora.jobs.execute.dlq}
    # worker 领取 job 的 Redis 短锁 TTL（秒）。权威状态在 Postgres，这里只是短锁。
    # 默认 660s 覆盖 600s 视频轮询窗口，避免 3~10 分钟的视频生成中途锁过期。
    lease-ttl-seconds: ${FLORA_JOB_LEASE_TTL_SECONDS:660}
    outbox:
      # dispatcher 的轮询间隔（毫秒）与单轮最多投递多少条。
      poll-ms: ${FLORA_OUTBOX_POLL_MS:500}
      batch-size: ${FLORA_OUTBOX_BATCH_SIZE:50}
      # 同一条 outbox 连续投递失败多少次后停在 failed（不再自动重试）。
      max-attempts: ${FLORA_OUTBOX_MAX_ATTEMPTS:10}
  # WP6 的预付费钱包。金额一律整数 credit（BIGINT）。
  billing:
    # 单次任务默认冻结 credit 数（正整数）。
    default-job-cost: ${FLORA_BILLING_DEFAULT_JOB_COST:10}
    # 新注册用户初始赠送 credit 数（默认 0；若 > 0 则注册时自动记一笔 topup 流水）。
    initial-credits: ${FLORA_BILLING_INITIAL_CREDITS:0}
    # 后台扫描 worker 已完成任务并自动 confirm/release 冻结单的间隔（毫秒）与批大小。
    settle-poll-ms: ${FLORA_BILLING_SETTLE_POLL_MS:200}
    settle-batch-size: ${FLORA_BILLING_SETTLE_BATCH_SIZE:50}
  # WP8 的火山引擎 TOS。api 只签发短期预签名读地址，字节由 worker 写入。
  storage:
    tos:
      # stub = 本地零密钥模式（worker 写 local-dir，api 同样按 V4 规则签出短期 URL）；http = 调真实火山 TOS HTTP 接口
      mode: ${FLORA_TOS_MODE:stub}
      endpoint: ${FLORA_TOS_ENDPOINT:https://tos-cn-beijing.volces.com}
      region: ${FLORA_TOS_REGION:cn-beijing}
      bucket: ${FLORA_TOS_BUCKET:flora-dev}
      access-key: ${FLORA_TOS_ACCESS_KEY:flora-local-ak}
      secret-key: ${FLORA_TOS_SECRET_KEY:flora-local-sk}
      presign-ttl-seconds: ${FLORA_TOS_PRESIGN_TTL_SECONDS:900}
      timeout-ms: ${FLORA_TOS_TIMEOUT_MS:15000}
      local-dir: ${FLORA_TOS_LOCAL_DIR:/tmp/flora-tos}
