# 仅本地依赖：Postgres + Redis。
# 不是 flora 全家桶编排（web / api / worker / rabbitmq 都不在这里）。
#
# 密码不写进仓库，启动前先导出：
#   export FLORA_DEPS_POSTGRES_PASSWORD=<本地开发用密码>
# 宿主机端口冲突时：
#   export FLORA_DEPS_POSTGRES_PORT=55432
#   export FLORA_DEPS_REDIS_PORT=56379

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flora
      POSTGRES_USER: flora
      POSTGRES_PASSWORD: ${FLORA_DEPS_POSTGRES_PASSWORD:?set FLORA_DEPS_POSTGRES_PASSWORD before starting local deps}
    ports:
      - "${FLORA_DEPS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - flora-deps-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flora -d flora"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${FLORA_DEPS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flora-deps-postgres:
