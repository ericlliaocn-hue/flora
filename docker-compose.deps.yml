# 仅本地依赖：Postgres + Redis + RabbitMQ。
# 不是 pilipala 全家桶编排（web / api / worker 都不在这里）。
#
# Postgres 库名/用户默认仍为 flora（运维切库前不改物理名）；密码不写进仓库，启动前先导出：
#   export PILIPALA_DEPS_POSTGRES_PASSWORD=<本地开发用密码>
# （仍接受 FLORA_DEPS_POSTGRES_PASSWORD 作为回退）
# 宿主机端口冲突时：
#   export PILIPALA_DEPS_POSTGRES_PORT=55432
#   export PILIPALA_DEPS_REDIS_PORT=56379
#   export PILIPALA_DEPS_RABBITMQ_PORT=5673
#
# RabbitMQ 用官方本地默认 guest/guest；只监听本机，别的环境必须改密码。
# 管理台（15672）默认也开，只给本机看。

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flora
      POSTGRES_USER: flora
      POSTGRES_PASSWORD: ${PILIPALA_DEPS_POSTGRES_PASSWORD:${FLORA_DEPS_POSTGRES_PASSWORD:?set PILIPALA_DEPS_POSTGRES_PASSWORD before starting local deps}}
    ports:
      - "${PILIPALA_DEPS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - flora-deps-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flora -d flora"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "${PILIPALA_DEPS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${PILIPALA_DEPS_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${PILIPALA_DEPS_RABBITMQ_PASSWORD:-guest}
    ports:
      - "${PILIPALA_DEPS_RABBITMQ_PORT:-5672}:5672"
      - "${PILIPALA_DEPS_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  flora-deps-postgres:
